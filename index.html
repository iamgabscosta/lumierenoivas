<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière Noivas</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/debutantes.css">
    <link rel="stylesheet" href="css/noivas.css">
    <link rel="stylesheet" href="css/noivos.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/politicaprivacidade.css">
    <link rel="stylesheet" href="css/termosdeuso.css">
    <link rel="stylesheet" href="css/comprasentregas.css">
    <link rel="stylesheet" href="css/trocasdevolucoes.css">
    <link rel="stylesheet" href="css/carrinho.css">
    <link rel="stylesheet" href="css/minhaconta.css">
</head>
<body id="inicio">
    <nav class="navbar">
        <div class="navbar-logo">
            <a href="index.html" aria-label="Voltar para a página inicial">
                <img src="assets/logo/logo.png" alt="Logo Lumière Noivas">
            </a>
        </div>
        <div class="navbar-links">
            <a href="#noivas" data-section="sections/noivas.html">Noivas</a>
            <a href="#madrinhas" data-section="sections/madrinhas.html">Madrinhas</a>
            <a href="#debutantes" data-section="sections/debutantes.html">Debutantes</a>
            <a href="#noivos" data-section="sections/noivos.html">Noivos</a>
            <a href="#contato" data-section="sections/agendamento.html">Agendamento</a>
        </div>
        <div class="navbar-acoes">
            <form class="barrapesquisa" id="formBusca" role="search">
                <label class="visually-hidden" for="campoBusca">Pesquisar categoria</label>
                <input type="search" id="campoBusca" class="campopesquisa" placeholder="O que você procura?" autocomplete="off">
                <button type="submit" class="botaopesquisa" aria-label="Pesquisar">
                    <img src="assets/icons/search.png" alt="">
                </button>
            </form>
            <div class="icone-perfil">
                <a href="#minhaconta" data-section="sections/minhaconta.html">
                    <img src="assets/icons/user.png" alt="Minha Conta" class="icone-minhaconta"/>
                </a>
            </div>
            <div class="icone-compras">
                <button class="botao-sacola" id="abrirSacola" type="button" aria-label="Abrir sacola de compras" aria-controls="painelSacola" aria-expanded="false">
                    <img src="assets/icons/bag.png" alt="" class="icone-bag">
                </button>
            </div>
        </div>
    </nav>
    <main id="conteudoPrincipal" tabindex="-1">
    </main>
    <footer class="footer">
        <p>© 2026 Coletivo6. Todos os direitos reservados. | 
            <a href="#politicaprivacidade" data-section="sections/politicaprivacidade.html">Política de Privacidade</a> | 
            <a href="#termosdeuso" data-section="sections/termosdeuso.html">Termos de Uso</a> |
            <a href="#comprasentregas" data-section="sections/comprasentregas.html">Compras e Entregas</a> |
            <a href="#trocasdevolucoes" data-section="sections/trocasdevolucoes.html">Trocas e Devoluções</a> 
        </p>
    </footer>
    <div class="fundo-sacola" id="fundoSacola" hidden></div>
    <aside class="painel-sacola" id="painelSacola" aria-labelledby="tituloSacola" aria-hidden="true">
        <header class="cabecalho-sacola">
            <h2 id="tituloSacola">Sacola</h2>
            <button class="fechar-sacola" id="fecharSacola" type="button" aria-label="Fechar sacola">×</button>
        </header>
        <div class="conteudo-sacola">
            <p class="sacola-vazia" id="sacolaVazia">Carrinho vazio</p>
            <ul class="lista-sacola" id="listaSacola" aria-live="polite"></ul>
        </div>
        <footer class="rodape-sacola">
            <div class="resumo-sacola">
                <span>Total</span>
                <strong id="totalSacola">R$ 0,00</strong>
            </div>
            <button class="botao-checkout" id="irParaCheckout" type="button" disabled>Ir para checkout</button>
        </footer>
    </aside>
    <a class="visually-hidden" id="linkCheckout" href="#checkout" data-section="sections/checkout.html">Ir para checkout</a>
    <script src="js/minhaconta.js"></script>
    <script src="js/loadSections.js"></script>
    <script src="js/search.js"></script>
    <script src="js/carrinho.js"></script>
</body>
</html>
